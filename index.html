<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿部寛のホームページになれる（非公式）</title><style>*{box-sizing:border-box}body{margin:0;background:#202020;color:white;font-family:system-ui}header{max-width:740px;margin:auto;padding:12px 14px 5px;text-align:center}h1{font-size:18px;margin:2px 0 4px}.caption{font-size:11px;color:#ddd;margin-bottom:7px}.board{max-width:740px;margin:0 auto;position:relative;overflow:hidden;background:white}.board>img{display:block;width:100%;height:auto}.hole{position:absolute;left:13.97264%;top:19.98497%;width:17.78212%;height:32.4568%;background:#000;overflow:hidden}.hole video,.hole img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}.hole video.mirror{transform:scaleX(-1)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:740px;margin:0 auto;padding:12px}button,label{border:1px solid #999;border-radius:7px;background:white;color:#222;font-size:15px;font-weight:600;text-align:center;padding:13px 5px;cursor:pointer}button.primary{background:#f4d2f0}input{display:none}#status{grid-column:1/-1;font-size:13px;text-align:center;min-height:20px}.note{max-width:740px;margin:auto;font-size:11px;text-align:center;padding:0 12px 15px;color:#ccc}#out{display:none}</style></head><body><header><h1>阿部寛のホームページになれる</h1><div class="caption">非公式パロディ／ご本人および公式サイトとは無関係です</div></header><div class="board" id="board"><img id="site" src="screenshot.png" alt="阿部寛のホームページのスクリーンショット"><div class="hole"><video autoplay playsinline muted id="video" hidden></video><img id="chosen" alt="" hidden></div></div><div class="controls"><button class="primary" id="start">カメラを起動</button><button id="flip">カメラ切替</button><label>写真を選ぶ<input type="file" accept="image/*" id="file"></label><button id="save">画像を保存</button><div id="status" role="status"></div></div><p class="note">カメラの映像や写真はサーバーへ送信されません。カメラはHTTPSで利用してください。</p><canvas id="out"></canvas><script>
const v=document.querySelector('#video'),p=document.querySelector('#chosen'),s=document.querySelector('#status'),bg=document.querySelector('#site'),cv=document.querySelector('#out');let stream=null,facing='user',mode='',objectURL=null;const msg=t=>s.textContent=t;
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function camera(){stop();if(!navigator.mediaDevices?.getUserMedia){msg('カメラにはHTTPSが必要です');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});v.srcObject=stream;await v.play();v.classList.toggle('mirror',facing==='user');v.hidden=false;p.hidden=true;mode='camera';msg('カメラを起動しました')}catch(e){msg('カメラを利用できません。端末の許可設定を確認してください。')}}
document.querySelector('#start').onclick=camera;document.querySelector('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';camera()};document.querySelector('#file').onchange=e=>{let f=e.target.files?.[0];if(!f)return;stop();if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);p.src=objectURL;p.hidden=false;v.hidden=true;mode='image';msg('写真を配置しました')};
function drawCover(ctx,el,x,y,w,h,sw,sh,mirror){let sc=Math.max(w/sw,h/sh),dw=sw*sc,dh=sh*sc;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();if(mirror){ctx.translate(x+w,y);ctx.scale(-1,1);x=0;y=0}ctx.drawImage(el,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore()}
document.querySelector('#save').onclick=()=>{if(!mode){msg('カメラか写真を選んでください');return}if(!bg.complete||!bg.naturalWidth){msg('背景画像がまだ読み込まれていません');return}let w=bg.naturalWidth,h=bg.naturalHeight;cv.width=w;cv.height=h;let ctx=cv.getContext('2d');ctx.drawImage(bg,0,0);let x=w*0.1397264,y=h*0.1998497,pw=w*0.1778212,ph=h*0.324568;let el=mode==='camera'?v:p,sw=el.videoWidth||el.naturalWidth,sh=el.videoHeight||el.naturalHeight;if(!sw){msg('画像を読み込み中です');return}drawCover(ctx,el,x,y,pw,ph,sw,sh,mode==='camera'&&facing==='user');cv.toBlob(blob=>{if(!blob){msg('保存に失敗しました');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='abe-camera.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);msg('画像を保存しました')},'image/png')};
bg.onerror=()=>msg('背景画像を読み込めません。screenshot.png をGitHubに置いてください');
</script></body></html>
